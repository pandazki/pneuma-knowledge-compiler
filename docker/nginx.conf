server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx resolves upstreams at startup by default, which makes the pod crashloop if the
    # API service isn't up yet. Resolve per-request against kube-dns instead.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # Cloudflare terminates TLS and forwards the real client IP here.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # nginx's own liveness — served locally, never proxied, so the web tier stays up
    # (and keeps serving the SPA shell) even while the API is restarting.
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
    }

    # The Live Context WebSocket. A dedicated location rather than adding Upgrade
    # headers to `/v1/` below: nginx matches regex locations BEFORE prefix ones, so this
    # wins for the WS path while every other /v1 request keeps its current handling
    # untouched. The canonical `map $http_upgrade $connection_upgrade` recipe is avoided
    # on purpose — `map` is an http-level directive, and hardcoding "Upgrade" is correct
    # here anyway because this location serves nothing but WebSocket.
    #
    # The timeout is long because SILENCE IS THIS FEATURE'S STEADY STATE — the server only
    # speaks only when relevant context survives the gates, so an idle connection is normal.
    # The app also pings ~30s, which is what keeps Cloudflare's ~100s idle timeout at bay.
    location ~ ^/v1/users/[^/]+/live-context/ws$ {
        set $api http://pneuma-knowledge-api.pneuma-knowledge.svc.cluster.local;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        set $api http://pneuma-knowledge-api.pneuma-knowledge.svc.cluster.local;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # /v1/users/{id}/recall/stream is a long-lived SSE response from a bounded agentic
        # deep recall. Buffering would hold every token until the run finished, and the
        # default 60s read timeout would sever the connection mid-run.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location = /healthz {
        set $api http://pneuma-knowledge-api.pneuma-knowledge.svc.cluster.local;
        proxy_pass $api/healthz;
        proxy_set_header Host $host;
    }

    # SPA history fallback. The no-cache header lives HERE, on the location that actually
    # serves the document: a visitor lands on `/`, not on `/index.html`, and the SPA navigates
    # by hash from then on — so a rule matching only the literal path never fired for anyone,
    # and a reload could keep running a stale bundle against a freshly deployed API. The hashed
    # assets below stay immutable; it is only the document that must be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
