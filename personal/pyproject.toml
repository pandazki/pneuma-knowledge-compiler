[project]
name = "pkc-personal"
version = "0.1.0"
description = "One machine, shared infrastructure, independently chosen knowledge libraries"
requires-python = ">=3.12"
dependencies = ["pneuma-knowledge-service", "pyyaml>=6"]

[project.scripts]
pkchome = "pkc_personal.cli:main"

[dependency-groups]
dev = ["pytest"]

# This project owns its environment even when it lives inside another uv workspace.
[tool.uv.workspace]
members = []

[tool.uv.sources]
pneuma-knowledge-service = { path = "../packages/pneuma-knowledge-service", editable = true }
pneuma-knowledge-core = { path = "../packages/pneuma-knowledge-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkc_personal"]
# The console dist is a built, git-ignored artifact (the repository's
# scripts/personal_console_dist.sh drops it here); hatch skips ignored files unless told.
# A wheel built from the git tree carries none, so the same directory is published per
# version by scripts/personal_console_release.sh and downloaded by `pkchome console install`.
artifacts = ["src/pkc_personal/console/dist/**"]

[tool.hatch.build.targets.wheel.force-include]
contracts = "pkc_personal/assets/contracts"
skill = "pkc_personal/assets/skill"

[tool.pytest.ini_options]
markers = ["slow: runs the real installer under a temporary HOME"]
testpaths = ["tests"]
