[project]
name = "pneuma-knowledge-eval"
version = "0.6.0"
description = "pneuma-knowledge-compiler evaluation: read-only judgement-quality metrics over compiled knowledge trajectories"
requires-python = ">=3.12"
dependencies = [
    "pneuma-knowledge-core",
    "langchain-openai>=1.3.5",
]

[project.optional-dependencies]
# The full mode's live QA arm talks HTTP to a running service; mechanical mode never does.
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_knowledge_eval"]
