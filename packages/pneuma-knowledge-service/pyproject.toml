[project]
name = "pneuma-knowledge-service"
version = "0.6.0"
description = "pneuma-knowledge-compiler cloud-native service: port implementations + FastAPI + compile worker"
requires-python = ">=3.12"
dependencies = [
    "pneuma-knowledge-core",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "qdrant-client>=1.18,<1.19",
    "meilisearch-python-sdk>=7.3,<8",
    "langchain",
    "langfuse",
    "langchain-openai>=1.3.5",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_knowledge_service"]
