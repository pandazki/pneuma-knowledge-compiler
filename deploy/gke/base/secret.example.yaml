# TEMPLATE ONLY — deliberately NOT listed in kustomization.yaml.
# Create the real secret out-of-band (see deploy/gke/README.md); never commit credentials.
#
#   kubectl -n pneuma-knowledge create secret generic pneuma-knowledge-secret \
#     --from-literal=OPENROUTER_API_KEY='sk-or-v1-...' \
#     --from-literal=PNEUMA_KNOWLEDGE_MEILI_KEY='...' \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=PNEUMA_KNOWLEDGE_PG_DSN='postgresql://pneuma_knowledge:...@postgres.pneuma-knowledge.svc.cluster.local:5432/pneuma_knowledge'
apiVersion: v1
kind: Secret
metadata:
  name: pneuma-knowledge-secret
  namespace: pneuma-knowledge
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  PNEUMA_KNOWLEDGE_MEILI_KEY: "REPLACE_ME"
  # Consumed by the postgres StatefulSet; must match the password inside PNEUMA_KNOWLEDGE_PG_DSN.
  POSTGRES_PASSWORD: "REPLACE_ME"
  PNEUMA_KNOWLEDGE_PG_DSN: "postgresql://pneuma_knowledge:REPLACE_ME@postgres.pneuma-knowledge.svc.cluster.local:5432/pneuma_knowledge"
  # Optional — tracing is a no-op unless all three are set.
  # LANGFUSE_PUBLIC_KEY: ""
  # LANGFUSE_SECRET_KEY: ""
  # LANGFUSE_BASE_URL: ""
