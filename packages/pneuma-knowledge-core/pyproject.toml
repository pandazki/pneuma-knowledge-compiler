[project]
name = "pneuma-knowledge-core"
version = "0.6.0"
description = "pneuma-knowledge-compiler core: pure domain logic + port abstractions (zero middleware deps)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "langchain-core",
    # langchain (create_agent, langgraph-backed) drives the agentic recall loops
    # (deep / briefing ask) — the mature ReAct harness, not a hand-rolled tool loop.
    "langchain>=1,<2",
    # chonkie is pure-compute chunking (no network/middleware, offline tokenizer), so it
    # belongs in core where chunking lives. See ingest/chunking.py.
    "chonkie>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_knowledge_core"]
