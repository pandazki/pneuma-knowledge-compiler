name: pneuma-opc-example

x-app-environment: &app-environment
  PNEUMA_OPC_EXAMPLE_MODE: ${PNEUMA_OPC_EXAMPLE_MODE:-keyless}
  PNEUMA_KNOWLEDGE_PG_DSN: postgresql://opc_example:opc_example@postgres:5432/opc_example
  PNEUMA_KNOWLEDGE_QDRANT_URL: http://qdrant:6333
  PNEUMA_KNOWLEDGE_QDRANT_COLLECTION: opc_example_chunks
  PNEUMA_KNOWLEDGE_MEILI_URL: http://meilisearch:7700
  PNEUMA_KNOWLEDGE_MEILI_KEY: opc_example_local_key
  PNEUMA_KNOWLEDGE_CANONICAL_ROOT: /data/canonical
  PNEUMA_KNOWLEDGE_DEFAULT_TIMEZONE: Asia/Shanghai
  PNEUMA_KNOWLEDGE_USER_SCHEMA_PACKS: "true"
  PNEUMA_KNOWLEDGE_USER_SCHEMA_BASE_VERSION: opc-example-v1
  PNEUMA_KNOWLEDGE_USER_SCHEMA_MATRIX_PATH: /app/examples/opc/assets/schema-matrix.json
  PNEUMA_KNOWLEDGE_EVOLVE_AUTO_TRIGGER: "false"
  PNEUMA_KNOWLEDGE_LLM_MODEL: ${PNEUMA_KNOWLEDGE_LLM_MODEL:-scripted:/app/examples/opc/data/demo/replay/recall.json}
  PNEUMA_KNOWLEDGE_LLM_MODEL_COMPILE: ${PNEUMA_KNOWLEDGE_LLM_MODEL_COMPILE:-}
  PNEUMA_KNOWLEDGE_LLM_MODEL_RECALL: ${PNEUMA_KNOWLEDGE_LLM_MODEL_RECALL:-}
  PNEUMA_KNOWLEDGE_LLM_MODEL_DEEP: ${PNEUMA_KNOWLEDGE_LLM_MODEL_DEEP:-}
  PNEUMA_KNOWLEDGE_LLM_MODEL_LIVE_CONTEXT: ${PNEUMA_KNOWLEDGE_LLM_MODEL_LIVE_CONTEXT:-}
  PNEUMA_KNOWLEDGE_LLM_MODEL_EVOLVE: ${PNEUMA_KNOWLEDGE_LLM_MODEL_EVOLVE:-}
  PNEUMA_KNOWLEDGE_EMBEDDING_MODEL: ${PNEUMA_KNOWLEDGE_EMBEDDING_MODEL:-fake:64}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

x-app-service: &app-service
  image: pneuma-opc-example-app
  build:
    context: ../..
    dockerfile: examples/opc/Dockerfile
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    meilisearch:
      condition: service_healthy
  volumes:
    - canonical_data:/data/canonical

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opc_example
      POSTGRES_USER: opc_example
      POSTGRES_PASSWORD: opc_example
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc_example -d opc_example"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:26333:6333"
      - "127.0.0.1:26334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: opc_example_local_key
      MEILI_ENV: development
    ports:
      - "127.0.0.1:27700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *app-service
    command: uvicorn examples.opc.api:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:28000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *app-service
    profiles: ["worker"]
    command: python -m examples.opc.worker

  web:
    build:
      context: ../..
      dockerfile: examples/opc/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:24173:80"

  cli:
    <<: *app-service
    profiles: ["tools"]
    entrypoint: ["python", "-m", "examples.opc"]
    command: ["--help"]
    volumes:
      - canonical_data:/data/canonical
      - ./var:/app/examples/opc/var

volumes:
  postgres_data:
  qdrant_data:
  meili_data:
  canonical_data:
