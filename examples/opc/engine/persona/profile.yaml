# 主体档案 —— 只放「注册级」信息：称呼、职业、语言时区这类稳定的自我介绍。
# 材料里的事实（谁负责什么、决定了什么）让编译自己去学，不要写进这里。
#
# locale 三项（时区/语言/地区）由 `./app.py init` 从系统自动检测（/etc/localtime
# 软链、$LANG），并在下面的 provenance 块里如实标注每一项是怎么来的：
#   - deployment_default = 从系统检测出来的默认值。编译会照实声明"这是检测值，
#     不是主人自己的设定"；此时时区不写入主体档案，只作为默认时区生效。
#   - profile = 你（或你的 AI 向导）亲自确认或改过这一项。确认后把对应
#     provenance 改成 profile，它才会作为你自己的设定写入档案。
#   - unstated = 尚未检测、尚未声明。

display_name: "林舟"
occupation: "独立开发者"
bio: "一个人做 Seamlog——把一次变更的原话、确认和当前状态串成可回查的证据链。代码、销售和运营都自己来。"
interests: ["变更证据链", "记录的可回溯性", "独立开发"]

# 三个枚举只影响回答风格，不影响入册判断。
# 个人/爱好场景不用对号入座：industry、role 就写 other，level 保持 mid 即可。
industry: tech        # tech / finance / sports / creative / education / healthcare / marketing / other
role: engineering     # engineering / marketing / product_management / sales / design / support / admin / other
level: senior         # entry / junior / mid / senior / staff / principal

locale:
  city: "杭州"                  # 主人自述
  country: "CN"                # 主人自述（init 从 $LANG 检测为 US，已按主人说法改正）
  timezone: "Asia/Shanghai"    # 主人自述，与系统检测一致
  language: "zh-CN"            # 主人自述：中文交流（init 检测为 en-US，已改正）

provenance:           # 上面三项的来源标注（取值含义见文件头注释）
  timezone: profile
  language: profile
  region: profile

preferences:
  response_language: "zh-CN"   # 主人自述：中文交流
