[project]
name = "pneuma-knowledge-strategies"
version = "0.6.0"
description = "pneuma-knowledge-compiler starting-point strategies: shipped domain contracts as data, with a loader and nothing else"
requires-python = ">=3.12"
# Deliberately empty, and it must stay empty. These are cold-start reference contracts,
# not framework machinery: the package depends on nothing, and nothing in the framework
# (core, service) depends on it. That is what keeps the core free of a domain opinion.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_knowledge_strategies"]
