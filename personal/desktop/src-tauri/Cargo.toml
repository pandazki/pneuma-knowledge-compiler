[package]
name = "pkc-desktop"
version = "0.1.0"
description = "A quiet tray for your personal knowledge libraries"
authors = ["Pneuma contributors"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "pkc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.0", features = [] }

[dependencies]
tauri-runtime-wry = "=3.0.0-alpha.1"
tauri = { version = "=3.0.0-alpha.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=3.0.0-alpha.0"
tauri-plugin-autostart = "=3.0.0-alpha.0"
tauri-plugin-positioner = { version = "=3.0.0-alpha.0", features = ["tray-icon"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
tokio = { version = "=1.47.1", features = ["process", "time", "net", "fs", "io-util", "sync", "macros"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json"] }
dirs = "=6.0.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.176"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.1"
objc = "=0.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
cargo-clippy = []
