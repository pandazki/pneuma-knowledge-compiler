# Optional owner declarations. A team/topic library need not have a personal biography.
# Keep unknown details blank; facts learned from material belong in sources, not here.
display_name: "{{DISPLAY_NAME}}"
occupation: "{{OCCUPATION}}"
bio: "{{BIO}}"
interests: {{INTERESTS}}

# Optional answer-style context; blank means unstated, not an inferred profession/seniority.
industry: {{INDUSTRY}}  # tech/finance/sports/creative/education/healthcare/marketing/other
role: {{ROLE}}          # engineering/marketing/product_management/sales/design/support/admin/other
level: {{LEVEL}}        # entry/junior/mid/senior/staff/principal

locale:
  city: ""
  country: ""
  timezone: ""
  language: ""

# init stamps detected values as deployment_default. Only explicit declarations use profile.
# Detection is a runtime default, not a statement of the owner's location or language.
provenance:
  timezone: unstated
  language: unstated
  region: unstated

preferences:
  response_language: ""  # empty follows locale.language as a runtime answer preference
