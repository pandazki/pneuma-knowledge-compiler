name: pneuma-knowledge-compiler

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    # 仅绑定 loopback，并使用独立开发端口避免和本机其他服务冲突。
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pneuma_knowledge
      POSTGRES_USER: pneuma_knowledge
      POSTGRES_PASSWORD: ${PNEUMA_KNOWLEDGE_PG_PASSWORD:-pneuma_knowledge}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pneuma_knowledge -d pneuma_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${PNEUMA_KNOWLEDGE_MEILI_KEY:-masterKey_change_me}
      MEILI_ENV: development
    ports:
      - "127.0.0.1:17700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${PNEUMA_KNOWLEDGE_MEDIA_S3_ACCESS_KEY:-pneuma_media_dev}
      RUSTFS_SECRET_KEY: ${PNEUMA_KNOWLEDGE_MEDIA_S3_SECRET_KEY:-pneuma_media_dev_secret_change_me}
    command: ["/data"]
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
  meili_data:
  rustfs_data:
