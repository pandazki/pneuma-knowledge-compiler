# This project's own middleware stack (Postgres / Qdrant / Meilisearch / RustFS), isolated from
# every other stack on the machine:
#   - project name and ports come from .env (scaffold/init.py probes free ports at
#     generation and writes them; app.py up echoes them). The project name owns the
#     volumes and network — renaming orphans the old volumes;
#   - everything binds 127.0.0.1 only.
# app.py asserts before connecting that the targets are exactly the ports .env declares.
#
#   docker compose -f docker-compose.yml up -d --wait
#
# An optional `console` profile adds the browsing layer — the framework API over this
# project's engine/ directory, a compile worker, and the web UI. See the bottom of this file.

name: ${PNEUMA_APP_COMPOSE_PROJECT:-pneuma-app}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pneuma_knowledge
      POSTGRES_USER: pneuma_knowledge
      POSTGRES_PASSWORD: ${PNEUMA_APP_PG_PASSWORD:-pneuma_knowledge}
    ports:
      - "127.0.0.1:${PNEUMA_APP_PG_PORT:-15436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pneuma_knowledge -d pneuma_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PNEUMA_APP_QDRANT_PORT:-16373}:6333"
      - "127.0.0.1:${PNEUMA_APP_QDRANT_GRPC_PORT:-16374}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${PNEUMA_APP_MEILI_KEY:-masterKey_change_me}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${PNEUMA_APP_MEILI_PORT:-17704}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${PNEUMA_APP_RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${PNEUMA_APP_RUSTFS_SECRET_KEY}
    command: ["/data"]
    ports:
      - "127.0.0.1:${PNEUMA_APP_RUSTFS_PORT:-19004}:9000"
      - "127.0.0.1:${PNEUMA_APP_RUSTFS_CONSOLE_PORT:-19005}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Optional: the browsing layer (API + worker + web UI) ─────────────────────
  # The everyday flow (ingest / compile / ask) is the CLI and needs none of this. Start it
  # when you want this project in a browser — the library, every citation back to the raw
  # material, and the Engine Console over engine/:
  #
  #   docker compose --profile console up -d --wait     # first build takes a few minutes
  #   open http://127.0.0.1:${PNEUMA_APP_WEB_PORT}
  #
  # All three services build from the framework repository named in .env. The project
  # directory is mounted at /project so the API and the worker run THIS project's own
  # entrypoints (server.py / worker.py), which register its compile contract — without that
  # the API could serve sources but never a skill.
  api:
    build:
      context: ${PNEUMA_APP_FRAMEWORK_REPO:-../..}
      dockerfile: docker/Dockerfile
    command: ["python", "/project/server.py"]
    profiles: ["console"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # The engine directory, mounted below. This one variable is what turns the console on.
      # Read-write because applying a change writes files and commits them in the engine's
      # own git repository.
      PNEUMA_KNOWLEDGE_ENGINE_DIR: /project/engine
      # Service-name hosts: correct inside the compose network, unlike .env's localhost ports.
      PNEUMA_KNOWLEDGE_PG_DSN: postgresql://pneuma_knowledge:${PNEUMA_APP_PG_PASSWORD:-pneuma_knowledge}@postgres:5432/pneuma_knowledge
      PNEUMA_KNOWLEDGE_QDRANT_URL: http://qdrant:6333
      PNEUMA_KNOWLEDGE_QDRANT_COLLECTION: ${PNEUMA_APP_QDRANT_COLLECTION:-pneuma_app_chunks}
      PNEUMA_KNOWLEDGE_MEILI_URL: http://meilisearch:7700
      PNEUMA_KNOWLEDGE_MEILI_KEY: ${PNEUMA_APP_MEILI_KEY:-masterKey_change_me}
      PNEUMA_KNOWLEDGE_MEDIA_S3_ENDPOINT_URL: http://rustfs:9000
      PNEUMA_KNOWLEDGE_MEDIA_S3_ACCESS_KEY: ${PNEUMA_APP_RUSTFS_ACCESS_KEY}
      PNEUMA_KNOWLEDGE_MEDIA_S3_SECRET_KEY: ${PNEUMA_APP_RUSTFS_SECRET_KEY}
      PNEUMA_KNOWLEDGE_CANONICAL_ROOT: /project/data/canonical
      PNEUMA_APP_KEYLESS_EMBEDDING: ${PNEUMA_APP_KEYLESS_EMBEDDING:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${PNEUMA_APP_LANGFUSE_BASE_URL_CONTAINER:-${LANGFUSE_BASE_URL:-}}
    volumes:
      - ./:/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:${PNEUMA_APP_LANGFUSE_LOCALHOST_GATEWAY:-127.0.0.1}"
    ports:
      - "127.0.0.1:${PNEUMA_APP_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The queue's doctor: ingesting from the browser only enqueues work, and a queue without a
  # worker leaves every upload sitting on "queued" forever. An idle worker costs nothing.
  worker:
    build:
      context: ${PNEUMA_APP_FRAMEWORK_REPO:-../..}
      dockerfile: docker/Dockerfile
    command: ["python", "/project/worker.py"]
    profiles: ["console"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      PNEUMA_KNOWLEDGE_ENGINE_DIR: /project/engine
      PNEUMA_KNOWLEDGE_PG_DSN: postgresql://pneuma_knowledge:${PNEUMA_APP_PG_PASSWORD:-pneuma_knowledge}@postgres:5432/pneuma_knowledge
      PNEUMA_KNOWLEDGE_QDRANT_URL: http://qdrant:6333
      PNEUMA_KNOWLEDGE_QDRANT_COLLECTION: ${PNEUMA_APP_QDRANT_COLLECTION:-pneuma_app_chunks}
      PNEUMA_KNOWLEDGE_MEILI_URL: http://meilisearch:7700
      PNEUMA_KNOWLEDGE_MEILI_KEY: ${PNEUMA_APP_MEILI_KEY:-masterKey_change_me}
      PNEUMA_KNOWLEDGE_MEDIA_S3_ENDPOINT_URL: http://rustfs:9000
      PNEUMA_KNOWLEDGE_MEDIA_S3_ACCESS_KEY: ${PNEUMA_APP_RUSTFS_ACCESS_KEY}
      PNEUMA_KNOWLEDGE_MEDIA_S3_SECRET_KEY: ${PNEUMA_APP_RUSTFS_SECRET_KEY}
      PNEUMA_KNOWLEDGE_CANONICAL_ROOT: /project/data/canonical
      PNEUMA_APP_KEYLESS_EMBEDDING: ${PNEUMA_APP_KEYLESS_EMBEDDING:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${PNEUMA_APP_LANGFUSE_BASE_URL_CONTAINER:-${LANGFUSE_BASE_URL:-}}
    volumes:
      - ./:/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:${PNEUMA_APP_LANGFUSE_LOCALHOST_GATEWAY:-127.0.0.1}"

  # The UI: the framework's SPA served by nginx, which also proxies /v1 to the api service
  # above — same origin, so no CORS surface and no build-time API URL.
  web:
    build:
      context: ${PNEUMA_APP_FRAMEWORK_REPO:-../..}
      dockerfile: docker/compose-web.Dockerfile
    profiles: ["console"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PNEUMA_APP_WEB_PORT:-18081}:80"

volumes:
  postgres_data:
  qdrant_data:
  meili_data:
  rustfs_data:

# An explicit subnet instead of Docker's default address pools: every compose project
# normally consumes one pool subnet, and a machine with many projects runs the pools dry
# ("all predefined address pools have been fully subnetted"). The generator probes a
# random unused 10.x.y.0/24 against the host routing table and writes it into .env; the
# fixed fallback below only serves hand-assembled projects.
networks:
  default:
    ipam:
      config:
        - subnet: ${PNEUMA_APP_SUBNET:-10.222.222.0/24}
