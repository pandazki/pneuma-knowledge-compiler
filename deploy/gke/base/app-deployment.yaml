# API + compile worker in ONE pod, sharing the canonical git PVC.
#
# Why colocated: both tiers touch the per-user git repos — the worker writes them, the API
# reads them for /dataset, /snapshots and recall. The PVC is ReadWriteOnce (GCE PD), so a
# split across two Deployments could not see the same filesystem. Single-writer safety is
# still enforced upstream by the PG queue's per-user `FOR UPDATE SKIP LOCKED` claim.
#
# replicas: 1 + Recreate — a rolling update would deadlock waiting to attach the PD to a
# second node while the old pod still holds it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pneuma-knowledge-app
  labels:
    app.kubernetes.io/name: pneuma-knowledge
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pneuma-knowledge
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pneuma-knowledge
        app.kubernetes.io/component: app
    spec:
      securityContext:
        fsGroup: 1000  # let the non-root git process write the mounted PD
      volumes:
        - name: canonical
          persistentVolumeClaim:
            claimName: pneuma-knowledge-canonical
      containers:
        - name: api
          image: pneuma-knowledge  # replaced by the kustomize images transformer
          command: ["uvicorn", "pneuma_knowledge_service.api.app:create_app", "--factory",
                    "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pneuma-knowledge-config
            - secretRef:
                name: pneuma-knowledge-secret
          volumeMounts:
            - name: canonical
              mountPath: /data/canonical
          # build_context() runs at lifespan startup and eagerly connects to PG (applying
          # schema.sql), probes the embedding dim against OpenRouter, then connects Meili
          # and Qdrant. That is a slow, network-dependent boot — hence a startupProbe with
          # a long budget (30 x 10s = 5min) instead of a generous initialDelay on readiness.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

        - name: worker
          image: pneuma-knowledge
          command: ["python", "-m", "pneuma_knowledge_service.workers.compile_worker"]
          envFrom:
            - configMapRef:
                name: pneuma-knowledge-config
            - secretRef:
                name: pneuma-knowledge-secret
          volumeMounts:
            - name: canonical
              mountPath: /data/canonical
          # The worker is a bare polling loop with no HTTP surface, so liveness is a process
          # check. Reads /proc/1/cmdline directly rather than using pgrep: procps is NOT in
          # python:3.12-slim, so a pgrep-based probe fails with "pgrep: not found" and gets
          # the container SIGKILLed every period — a self-inflicted restart loop around a
          # perfectly healthy worker.
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -q compile_worker /proc/1/cmdline"]
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
