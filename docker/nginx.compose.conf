# nginx for a compose-run project: serves the built SPA and reverse-proxies the API, whose
# upstream is the compose service named `api` (docker/compose-web.Dockerfile).
server {
    listen 80;
    server_name _;
    # Docker's embedded DNS, re-resolved per request: a literal proxy_pass hostname is
    # resolved ONCE at nginx startup, so recreating the api container (env change,
    # rebuild) leaves this proxy answering 502 from a dead address until a manual
    # restart. A variable upstream forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/v1/users/[^/]+/live-context/ws$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /healthz {
        proxy_pass $api_upstream/healthz;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA navigates by hash and never refetches index.html on its own; without an
    # explicit no-cache, a long-lived tab (or a heuristic-cached reload) keeps running a
    # stale bundle long after the hashed assets moved on. Assets stay immutable below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
